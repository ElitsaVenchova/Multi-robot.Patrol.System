simulation:
  duration: 3600
  seed: 42
  chargeThreshold: 20.0

perimeter:
  size: 1000
  type: LINEAR

robots:
  - model: turtlebot_pi
    count: 5

chargingStations:
  - model: fast_station
    x: 10.0
    y: 5.0

  - model: cheap_station
    x: 50.0
    y: 2.0

patrol:
  model: AsyncPatrol
  deviationProbability: 0.10
  maxDeviationDuration: 20

attackModel:
  model: PoissonAttack
  lambda: 0.3